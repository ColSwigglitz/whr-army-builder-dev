name: Build dev JavaScript bundle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bundle
        run: python tools/build_dev_bundle.py

      - name: Commit generated bundle
        run: |
          if git diff --quiet -- index.html dev_bundle.js; then
            echo "Bundle already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dev_bundle.js
          git commit -m "Build consolidated dev JavaScript bundle [bundle]"
          git push
