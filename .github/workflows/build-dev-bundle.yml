name: Build dev JavaScript bundles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bundles
        run: python tools/build_dev_bundle.py

      - name: Commit generated bundles
        run: |
          FILES="index.html dev_core_bundle.js dev_account_bundle.js dev_campaign_bundle.js"
          if git diff --quiet -- $FILES && [ -f dev_core_bundle.js ] && [ -f dev_account_bundle.js ] && [ -f dev_campaign_bundle.js ]; then
            echo "Bundles already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Build split dev JavaScript bundles [bundle]"
          git push
